{% extends "base.html" %}

{% block title %}Add a Teacher | Rate My Teacher{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-container">

        <div class="form-header">

            <p class="page-label">
                Add teacher
            </p>

            <h1>Add a teacher</h1>

            <p>
                Can't find your teacher? Add them so students
                can share their experiences.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('add_teacher') }}"
            class="main-form"
        >

            <div class="form-group">

                <label for="name">
                    Teacher name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Example: John Smith"
                    required
                    maxlength="100"
                >

            </div>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    id="subject"
                    name="subject"
                    type="text"
                    placeholder="Example: Biology"
                    required
                    maxlength="100"
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Add teacher
                </button>

                <a
                    href="{{ url_for('home') }}"
                    class="button button-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
