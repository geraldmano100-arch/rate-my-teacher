<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Rate the Teach
        {% endblock %}
    </title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="site-header">

        <div class="header-inner">


            <!-- Logo -->

            <a
                href="{{ url_for('home') }}"
                class="brand"
            >

                <span class="brand-mark">
                    RTT
                </span>

                <span class="brand-name">
                    Rate the Teach<span class="brand-dot">.</span>
                </span>

            </a>


            <!-- Navigation -->

            <nav class="site-nav">

                <a
                    href="{{ url_for('home') }}#schools"
                >
                    Schools
                </a>


                <a
                    href="{{ url_for('add_teacher') }}"
                    class="nav-button"
                >
                    Add a Teacher
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================================
         FLASH MESSAGES
    ========================================== -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="flash-container">

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <p>
                Rate the Teach
                <span>·</span>
                Student reviews for students
            </p>

        </div>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>
</html>
